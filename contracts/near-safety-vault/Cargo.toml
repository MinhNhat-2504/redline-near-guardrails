[package]
name = "redline-safety-vault"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.near]
min_protocol_version = 88

[lib]
crate-type = ["cdylib", "rlib"]

# Isolate NEAR from the preserved Anchor workspace.
[workspace]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
