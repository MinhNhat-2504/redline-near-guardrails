name: NEAR frontend
on:
  push:
    branches: [main, feat/near-mvp]
    paths: ["src/**", "package.json", "package-lock.json", "vite.config.ts", "vitest.config.ts", "tsconfig.json", "docs/evidence/phase3-api-allow-after.json", ".github/workflows/near-frontend.yml"]
  pull_request:
    paths: ["src/**", "package.json", "package-lock.json", "vite.config.ts", "vitest.config.ts", "tsconfig.json", "docs/evidence/phase3-api-allow-after.json", ".github/workflows/near-frontend.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  near-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Tests use public saved RPC data or mocks. No wallet credentials or live transactions.
      - run: npm run check
